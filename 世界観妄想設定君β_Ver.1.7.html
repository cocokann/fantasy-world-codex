<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>世界観妄想設定君β Ver.1.7</title>
<style>
:root{
  --bg:#17130f;
  --panel:#221c16;
  --panel2:#2e261e;
  --gold:#d7ad63;
  --text:#f0e6d4;
  --muted:#b0a08c;
  --line:#4a3c2e;
  --danger:#a94a43;
  --header-h:58px;
  --aside-w:168px;
  --font:"Hiragino Mincho ProN","Hiragino Mincho Pro","Yu Mincho","YuMincho","MS PMincho","MS Mincho","Noto Serif JP",serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  line-height:1.45;
  font-size:14px;
  min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

header{
  padding:10px 18px;
  border-bottom:1px solid var(--line);
  background:#1a1511;
  position:sticky;
  top:0;
  z-index:5;
  height:var(--header-h);
  display:flex;
  flex-direction:column;
  justify-content:center;
}
header h1{
  margin:0;
  color:var(--gold);
  font-size:18px;
  font-weight:600;
  letter-spacing:.04em;
}
header p{margin:0;font-size:11px;color:var(--muted)}

.layout{display:flex;min-height:calc(100vh - var(--header-h))}
aside{
  width:var(--aside-w);
  background:#1a1511;
  border-right:1px solid var(--line);
  padding:8px 6px;
  position:fixed;
  top:var(--header-h);
  left:0;
  height:calc(100vh - var(--header-h));
  overflow:auto;
  display:flex;
  flex-direction:column;
  z-index:4;
}
nav{flex:1}
nav button{
  width:100%;
  text-align:left;
  background:transparent;
  color:var(--text);
  border:0;
  border-radius:4px;
  padding:7px 10px;
  margin:0;
  font-size:13px;
}
nav button:hover,nav button.active{background:var(--panel2);color:var(--gold)}
aside .side-actions{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
  display:flex;
  flex-direction:column;
  gap:4px;
}
aside .side-actions .btn{width:100%;font-size:12px;padding:6px 8px}

main{
  flex:1;
  margin-left:var(--aside-w);
  padding:14px 18px 24px;
  max-width:960px;
  min-width:0;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:12px;
}
.btn{
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  padding:6px 12px;
  border-radius:4px;
  font-size:13px;
}
.btn:hover{background:#3a3026}
.btn.primary{background:#6a4e28;border-color:#8a6a3a;color:#f5ead4}
.btn.primary:hover{background:#7a5a32}
.btn.danger{background:#4a2220;border-color:#6d3530}
.btn.danger:hover{background:#5c2a28}

h2.section-title{
  color:var(--gold);
  font-size:15px;
  font-weight:600;
  margin:0 0 8px;
  letter-spacing:.03em;
}
.world-desc{
  white-space:pre-wrap;
  color:var(--muted);
  margin:0 0 10px;
  font-size:13px;
  line-height:1.5;
  max-height:4.5em;
  overflow:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:10px;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:6px;
  padding:10px 12px;
  display:flex;
  flex-direction:column;
}
.card h3{
  margin:0 0 4px;
  color:var(--gold);
  font-size:14px;
  font-weight:600;
}
.card .preview{
  flex:1;
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
}
.card .preview b{color:var(--text);font-weight:500}
.card .actions{margin-top:8px}

.empty{
  padding:28px 14px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:6px;
  grid-column:1/-1;
  font-size:13px;
}

.search{
  width:100%;
  max-width:280px;
  background:#14100c;
  border:1px solid var(--line);
  color:var(--text);
  padding:6px 10px;
  border-radius:4px;
  font-size:13px;
}
.search:focus{outline:none;border-color:#6b5236}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin:10px 0 3px;
}
label:first-child{margin-top:0}
input,textarea,select{
  width:100%;
  background:#14100c;
  border:1px solid var(--line);
  color:var(--text);
  padding:7px 9px;
  border-radius:4px;
  font-size:13px;
}
input:focus,textarea:focus,select:focus{outline:none;border-color:#6b5236}
textarea{min-height:72px;resize:vertical}.textarea-large{min-height:110px}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:0 14px;
  max-width:440px;
}
.full{grid-column:1/-1}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  z-index:20;
}
.modal.show{display:flex}
.dialog{
  width:min(640px,100%);
  max-height:88vh;
  overflow:auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
}
.dialog h2{
  margin:0 0 10px;
  color:var(--gold);
  font-size:16px;
}

.status{font-size:11px;color:var(--muted);margin-left:auto;align-self:center}
.status.saved{color:#9bc58d}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(88px,1fr));
  gap:6px;
  margin-bottom:12px;
}
.stat{
  background:var(--panel);
  border:1px solid var(--line);
  padding:8px 10px;
  border-radius:4px;
}
.stat small{display:block;color:var(--muted);font-size:11px}
.stat b{font-size:18px;color:var(--gold);font-weight:600;line-height:1.2}

.home-row{
  display:grid;
  grid-template-columns:1fr auto;
  gap:14px;
  align-items:start;
  margin-bottom:12px;
}
.regionmap{
  display:grid;
  grid-template-columns:1fr 1.1fr 1fr;
  grid-template-rows:auto auto auto;
  gap:4px;
  width:200px;
}
.region{
  min-height:40px;
  border:1px solid #5a4634;
  background:var(--panel);
  border-radius:4px;
  padding:4px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--gold);
  font-weight:600;
  font-size:12px;
  cursor:pointer;
}
.region:hover{border-color:var(--gold);background:var(--panel2)}
.region small{font-weight:400;color:var(--muted);font-size:10px}
.region.north{grid-column:2;grid-row:1}
.region.west{grid-column:1;grid-row:2}
.region.center{grid-column:2;grid-row:2;min-height:52px}
.region.east{grid-column:3;grid-row:2}
.region.south{grid-column:2;grid-row:3}

.actions{display:flex;gap:5px;flex-wrap:wrap}
.actions .btn{padding:4px 8px;font-size:11px}

.character-card{flex-direction:row;gap:10px;align-items:flex-start}
.character-card .char-body{flex:1;min-width:0}
.char-icon,.char-icon-placeholder{
  width:52px;height:52px;border-radius:50%;object-fit:cover;
  border:1px solid var(--line);background:#14100c;flex-shrink:0;
}
.char-icon-placeholder{
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:11px;
}

.image-preview{
  max-width:140px;max-height:140px;border:1px solid var(--line);
  border-radius:4px;object-fit:contain;background:#14100c;margin-top:6px;
}
.file-note{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}

.map-wrap{
  position:relative;display:inline-block;max-width:100%;
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#14100c;
}
.map-img{display:block;max-width:100%;height:auto;max-height:42vh;object-fit:contain}
.map-pin{
  position:absolute;transform:translate(-50%,-100%);
  width:14px;height:14px;cursor:pointer;z-index:2;
}
.map-pin::before{
  content:"";display:block;width:10px;height:10px;margin:2px;
  background:var(--gold);border:1.5px solid #1a1511;
  border-radius:50% 50% 50% 0;transform:rotate(-45deg);
}
.map-pin span{
  display:block;position:absolute;left:50%;top:0;
  transform:translate(-50%,-100%);white-space:nowrap;
  background:rgba(0,0,0,.62);color:#fff;
  padding:1px 2px;border-radius:2px;font-size:7px;line-height:1.05;pointer-events:auto;cursor:pointer;
}
.map-pin:hover span{display:block}
.map-tools{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.map-empty{
  padding:18px 12px;text-align:center;color:var(--muted);
  border:1px dashed var(--line);border-radius:6px;font-size:13px;
}
.pin-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:6px;margin-top:8px;
}
.pin-item{
  background:var(--panel);border:1px solid var(--line);
  border-radius:4px;padding:8px 10px;font-size:12px;
}
.pin-item b{color:var(--gold);font-weight:600}
.pin-item small{color:var(--muted)}
.clickable-map{cursor:crosshair}

.section-block{margin-top:14px}
.section-block:first-of-type{margin-top:0}

/* 相関図 */
.rel-diagram{
  position:relative;width:100%;min-height:280px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:6px;overflow:hidden;margin-bottom:12px;
}
.rel-diagram svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rel-diagram svg line{stroke:#5a4634;stroke-width:1.5}
.rel-diagram svg text{
  fill:var(--gold);font-size:11px;font-family:var(--font);
  text-anchor:middle;dominant-baseline:middle;
}
.rel-node{
  position:absolute;transform:translate(-50%,-50%);
  text-align:center;z-index:1;width:72px;
}
.rel-node .rel-avatar,.rel-node .rel-avatar-ph{
  width:48px;height:48px;border-radius:50%;object-fit:cover;
  border:2px solid var(--gold);background:#14100c;
  display:block;margin:0 auto 4px;
}
.rel-node .rel-avatar-ph{
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;
}
.rel-node .rel-name{
  font-size:11px;color:var(--text);line-height:1.25;
  word-break:break-all;max-width:72px;margin:0 auto;
}
.rel-list{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;
}
.rel-card{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:8px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
.rel-card .rel-pair{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.rel-card .mini-avatar,.rel-card .mini-avatar-ph{
  width:32px;height:32px;border-radius:50%;object-fit:cover;
  border:1px solid var(--line);background:#14100c;flex-shrink:0;
}
.rel-card .mini-avatar-ph{
  display:flex;align-items:center;justify-content:center;
  color:var(--muted);font-size:10px;
}
.rel-card .rel-meta{flex:1;min-width:0;font-size:12px}
.rel-card .rel-meta b{color:var(--gold)}
.rel-card .rel-type{
  display:inline-block;background:var(--panel2);border:1px solid var(--line);
  border-radius:3px;padding:1px 6px;font-size:11px;color:var(--gold);margin:0 3px;
}
.rel-empty-hint{padding:20px 12px;text-align:center;color:var(--muted);font-size:13px}

@media(max-width:800px){
  :root{--aside-w:140px}
  main{padding:10px 12px 20px}
  .formgrid{max-width:100%;gap:0 10px}
  .home-row{grid-template-columns:1fr}
  .regionmap{width:100%;max-width:220px}
}
@media(max-width:560px){
  .layout{flex-direction:column}
  aside{
    width:100%;height:auto;position:sticky;top:var(--header-h);
    border-right:0;border-bottom:1px solid var(--line);padding:6px;
  }
  main{margin-left:0}
  nav{display:flex;flex-wrap:wrap;gap:2px}
  nav button{width:auto;padding:5px 8px;font-size:12px}
  aside .side-actions{flex-direction:row;margin-top:6px;padding-top:6px}
  aside .side-actions .btn{width:auto;flex:1}
}

}

.formgrid{

}
.dialog{

}
.dialog h2{

}

.status{font-size:9px}

.home-row{gap:9px}

}

}

}

}

}

}

}

/* タブレット */
@media(max-width:800px){
  :root{--aside-w:116px}
  main{
    padding:8px 9px 14px;
    width:calc(100% - var(--aside-w));
  }
  aside{padding:4px 3px}
  nav button{font-size:10px;padding:5px 5px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}
  .formgrid{max-width:100%}
}

/* スマホ */
@media(max-width:560px){
  :root{--header-h:44px}

  header{
    padding:5px 9px;
  }
  header h1{font-size:13px}
  header p{font-size:8px}

  .layout{display:flex;flex-direction:column}

  aside{
    width:100%;
    height:auto;
    position:sticky;
    top:var(--header-h);
    padding:3px;
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  nav{
    display:flex;
    flex-wrap:nowrap;
    gap:2px;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  nav::-webkit-scrollbar{display:none}
  nav button{
    flex:0 0 auto;
    width:auto;
    padding:4px 6px;
    font-size:9px;
    white-space:nowrap;
  }

  aside .side-actions{
    flex-direction:row;
    margin-top:3px;
    padding-top:3px;
  }
  aside .side-actions .btn{
    width:auto;
    flex:1;
    padding:4px 5px;
    font-size:9px;
  }

  main{
    margin-left:0;
    width:100%;
    padding:7px 7px 12px;
  }

  .toolbar{
    gap:4px;
  }
  .toolbar .search{
    flex:1 1 130px;
    max-width:none;
  }
  .btn{
    padding:4px 7px;
    font-size:10px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:5px;
  }
  .card{
    padding:6px 7px;
  }
  .card h3{font-size:11px}
  .card .preview{font-size:9px}
  .actions .btn{font-size:9px;padding:3px 5px}

  .stats{
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:3px;
  }
  .stat{
    padding:5px 4px;
    text-align:center;
  }
  .stat small{font-size:8px}
  .stat b{font-size:13px}

  .home-row{grid-template-columns:1fr}
  .regionmap{
    width:100%;
    max-width:190px;
  }

  .formgrid{
    grid-template-columns:1fr;
    gap:0;
  }
  .formgrid > div{grid-column:1/-1}
  /* 場所フォームだけはスマホでも指定どおり2列を維持 */
  .formgrid.location-formgrid,
  .formgrid.character-formgrid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:0 10px;
  }
  .formgrid.location-formgrid > div,
  .formgrid.character-formgrid > div{grid-column:auto}
  .formgrid.location-formgrid > .full,
  .formgrid.character-formgrid > .full{grid-column:1/-1}
  .dialog{
    width:96vw;
    max-height:94vh;
    padding:9px 10px;
  }

  .map-img{
    width:100%;
    max-height:55vh;
  }
  .pin-list{
    grid-template-columns:1fr 1fr;
  }

  .rel-diagram{
    min-height:190px;
  }
  .rel-node{width:52px}
  .rel-node .rel-avatar,.rel-node .rel-avatar-ph{
    width:34px;height:34px;
  }
  .rel-node .rel-name{
    font-size:8px;
    max-width:52px;
  }
  .rel-list{grid-template-columns:1fr}
}



.location-group{border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden;margin-bottom:8px}
.location-group-title{padding:7px 10px;border-bottom:1px solid var(--line);color:var(--gold);font-size:13px;font-weight:600;background:rgba(255,255,255,.015)}
.location-group-title .territory-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;border:1px solid rgba(255,255,255,.35);vertical-align:middle}
.location-group .item-list{border:0;border-radius:0;background:transparent}
.location-group .item-row{padding-left:18px}

function openImageDB(){
  if(imageDBPromise)return imageDBPromise;
  imageDBPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open(IMAGE_DB_NAME,IMAGE_DB_VERSION);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(IMAGE_STORE))r.result.createObjectStore(IMAGE_STORE)};
    r.onsuccess=()=>resolve(r.result); r.onerror=()=>reject(r.error);
  });
  return imageDBPromise;
}
async function putImage(dataUrl){
  if(window.saveCloudImage) return await window.saveCloudImage(dataUrl);
  const key=crypto.randomUUID();
  const dbi=await openImageDB();
  await new Promise((resolve,reject)=>{const tx=dbi.transaction(IMAGE_STORE,"readwrite");tx.objectStore(IMAGE_STORE).put(dataUrl,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});
  imageCache.set(key,dataUrl); return "idb:"+key;
}
async function getImage(ref){
  if(!ref)return "";
  if(String(ref).startsWith("fsimg:")){
    if(window.getCloudImage) return await window.getCloudImage(String(ref).slice(6));
    return "";
  }
  if(!String(ref).startsWith("idb:"))return ref;
  const key=String(ref).slice(4);
  if(imageCache.has(key))return imageCache.get(key);
  const dbi=await openImageDB();
  const data=await new Promise((resolve,reject)=>{const tx=dbi.transaction(IMAGE_STORE,"readonly");const q=tx.objectStore(IMAGE_STORE).get(key);q.onsuccess=()=>resolve(q.result||"");q.onerror=()=>reject(q.error)});
  if(data)imageCache.set(key,data); return data||"";
}
function imageSrc(ref){return ref&&String(ref).startsWith("idb:")?(imageCache.get(String(ref).slice(4))||""):ref||""}
function collectImageRefs(){
  const refs=[]; if(!db)return refs;
  if(db.world?.mapImage)refs.push(db.world.mapImage);
  for(const arr of Object.values(db.data||{}))if(Array.isArray(arr))for(const x of arr)if(x?.image)refs.push(x.image);
  return [...new Set(refs.filter(x=>String(x).startsWith("idb:")))];
}
async function preloadWorldImages(){
  const refs=collectImageRefs(); await Promise.all(refs.map(getImage));
}
async function deleteImageRef(ref){
  if(!ref||!String(ref).startsWith("idb:"))return;
  const key=String(ref).slice(4); imageCache.delete(key);
  try{const dbi=await openImageDB();await new Promise((resolve,reject)=>{const tx=dbi.transaction(IMAGE_STORE,"readwrite");tx.objectStore(IMAGE_STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(e){console.warn(e)}
}
function isImageRef(v){return v&&String(v).startsWith("idb:")}

function emptyWorld(name){
  const data={};
  for(const k in TYPES) data[k]=[];
  data.relations=[];
  return {
    id:crypto.randomUUID(),
    world:{name:name||"新しいファンタジー世界",description:"",mapImage:"",pins:[]},
    data
  };
}
function normalizeWorld(w){
  w.world=w.world||{name:"新しいファンタジー世界",description:"",mapImage:"",pins:[]};
  w.world.pins=w.world.pins||[];
  w.world.mapImage=w.world.mapImage||"";
  w.world.name=w.world.name||"新しいファンタジー世界";
  w.data=w.data||{};
  for(const k in TYPES) w.data[k]=w.data[k]||[];
  w.data.relations=w.data.relations||[];
  (w.data.locations||[]).forEach(l=>{l.image=l.image||"";l.imagePins=Array.isArray(l.imagePins)?l.imagePins:[];l.territoryId=l.territoryId||""});
  (w.data.territories||[]).forEach(r=>{r.description=r.description||"";r.color=r.color||"#e74c3c";r.cells=Array.isArray(r.cells)?r.cells:[]});
  if(!w.id) w.id=crypto.randomUUID();
  return w;
}
function loadStore(){
  let store=null;
  try{store=JSON.parse(localStorage.getItem("fantasyWorldCodexStore")||"null")}catch{}
  if(!store||!Array.isArray(store.worlds)){
    // 旧形式からの移行
    let old=null;
    try{old=JSON.parse(localStorage.getItem("fantasyWorldCodex")||"null")}catch{}
    if(old&&old.data){
      const w=normalizeWorld(old);
      store={worlds:[w],currentId:w.id};
    }else{
      store={worlds:[],currentId:null};
    }
  }
  store.worlds=store.worlds.map(normalizeWorld);
  return store;
}

function save(){
  try{
    if(db&&store.currentId){
      const i=store.worlds.findIndex(w=>w.id===store.currentId);
      if(i>=0) store.worlds[i]=db;
    }
    localStorage.setItem("fantasyWorldCodexStore",JSON.stringify(store));
    if(window.queueCloudSave && window.onlineUser) window.queueCloudSave();
    const el=document.getElementById("saveStatus");
    if(el){el.textContent="保存済み";el.className="status saved";clearTimeout(save.t);save.t=setTimeout(()=>{if(el){el.textContent="自動保存";el.className="status"}},1600)}

}

function territoryColors(){return ["#e74c3c","#e67e22","#f1c40f","#2ecc71","#1abc9c","#3498db","#2980b9","#9b59b6","#8e44ad","#e84393","#fd79a8","#00b894","#00cec9","#6c5ce7","#636e72","#95a5a6"]}
function territoryById(id){return (db?.data?.territories||[]).find(r=>r.id===id)}
function hasTerritoryCell(cells,r,c){return (cells||[]).some(v=>Array.isArray(v)&&v[0]===r&&v[1]===c)}
function territoryOverlayColor(hex,alpha){const h=String(hex||"#e74c3c").replace("#","");const n=parseInt(h,16);if(!Number.isFinite(n))return `rgba(231,76,60,${alpha})`;return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${alpha})`}
function territoryCenter(cells){if(!cells.length)return {r:0,c:0};let sr=0,sc=0;cells.forEach(v=>{sr+=v[0];sc+=v[1]});return {r:sr/cells.length,c:sc/cells.length}}
function renderTerritoryOverlay(id){const target=id===undefined?activeTerritoryId:id;const arr=target==="ALL"?(db.data.territories||[]):target?[(db.data.territories||[]).find(r=>r.id===target)].filter(Boolean):[];if(!arr.length)return "";return `<div class="territory-overlay">${arr.map(r=>{if(!r.cells?.length)return "";const color=territoryOverlayColor(r.color,.34),ctr=territoryCenter(r.cells);const cells=r.cells.map(v=>`<div class="territory-overlay-cell" style="left:${v[1]*5}%;top:${v[0]*(100/12)}%;width:5%;height:${100/12}%;background:${color}"></div>`).join("");return `${cells}<div class="territory-overlay-name" style="left:${ctr.c*5+2.5}%;top:${ctr.r*(100/12)+(50/12)}%">${esc(r.name)}</div>`}).join("")}</div>`}

function openTerritoryForm(id=null){const x=id?(db.data.territories||[]).find(r=>r.id===id):null;editing=id;territoryDraftCells=JSON.parse(JSON.stringify(x?.cells||[]));territoryDraftColor=x?.color||"#e74c3c";const colors=territoryColors(),grid=[];for(let r=0;r<12;r++)for(let c=0;c<20;c++){const on=hasTerritoryCell(territoryDraftCells,r,c);grid.push(`<button type="button" class="territory-cell ${on?"selected":""}" data-r="${r}" data-c="${c}" style="${on?`background:${territoryOverlayColor(territoryDraftColor,.48)};`:""}" onclick="toggleTerritoryCell(${r},${c})"></button>`)}document.getElementById("modalBody").innerHTML=`<h2>${id?"編集":"新規"} 領地</h2><label>領地名 *</label><input id="territoryName" value="${esc(x?.name||"")}" placeholder="例：シュヴルエラ領地"><label>説明</label><textarea id="territoryDescription" placeholder="領地の概要">${esc(x?.description||"")}</textarea><label>領地の色（16色）</label><div class="territory-colors">${colors.map(c=>`<button type="button" class="territory-color ${territoryDraftColor===c?"selected":""}" data-color="${c}" style="background:${c}" onclick="setTerritoryColor('${c}')"></button>`).join("")}</div><label>世界地図上の領域</label>${db.world.mapImage?`<div class="territory-editor-map"><img src="${imageSrc(db.world.mapImage)}"><div class="territory-grid">${grid.join("")}</div></div><div class="file-note">マスをタップして領域を選択・解除します。20×12のマスで大まかな範囲を指定します。</div>`:`<div class="map-empty">先に世界地図を設定してください。</div>`}<div class="actions" style="justify-content:flex-end;margin-top:12px"><button class="btn" onclick="closeModal()">キャンセル</button><button class="btn primary" onclick="saveTerritory('${id||""}')">保存</button></div>`;document.getElementById("modal").classList.add("show")}
function toggleTerritoryCell(r,c){const i=territoryDraftCells.findIndex(v=>v[0]===r&&v[1]===c);if(i>=0)territoryDraftCells.splice(i,1);else territoryDraftCells.push([r,c]);const el=document.querySelector(`.territory-cell[data-r="${r}"][data-c="${c}"]`);if(el){const on=i<0;el.classList.toggle("selected",on);el.style.background=on?territoryOverlayColor(territoryDraftColor,.48):""}}

function buildItemMetaOneLine(type,x){
  const parts=[];
  const add=(v)=>{if(v&&String(v).trim()) parts.push(esc(String(v).trim()))};
  if(type==="characters"){
    add([x.age,x.gender].filter(Boolean).join(" / "));
    add([x.occupation,x.faction].filter(Boolean).join(" / "));
    add(x.home);
    add([x.personality,x.weapon].filter(Boolean).join(" / "));
  }else if(type==="factions"){
    add(x.type);add(x.leader);add(x.capital);
  }else if(type==="locations"){
    add(x.type);const tr=(db.data.territories||[]).find(r=>r.id===x.territoryId);add(tr?"領地："+tr.name:"");add(x.region);add(x.owner);
  }else if(type==="races"){
    add((x.appearance||"").slice(0,40));add((x.culture||"").slice(0,40));
  }else if(type==="magic"){
    add(x.category);add((x.effects||"").slice(0,40));
  }else if(type==="items"){
    add(x.type);add(x.owner);add((x.ability||"").slice(0,40));
  }else if(type==="glossary"){
    add(x.category);add((x.meaning||"").slice(0,50));
  }else{
    Object.entries(x).filter(([k])=>!["name","id","image"].includes(k)&&x[k]).slice(0,3)
      .forEach(([,v])=>add(String(v).slice(0,40)));
  }
  return parts.join('<span class="meta-sep">·</span>');
}

function compressImage(file,maxSide,quality){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxSide||h>maxSide){
          if(w>=h){h=Math.round(h*maxSide/w);w=maxSide}
          else{w=Math.round(w*maxSide/h);h=maxSide}
        }
        const canvas=document.createElement("canvas");
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality||0.72));
      };
      img.onerror=reject;
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function previewImage(input){
  const file=input.files[0];if(!file)return;
  try{
    const dataUrl=await compressImage(file,1200,0.78);
    const ref=await putImage(dataUrl);
    document.getElementById("imageValue").value=ref;

function timelineSortKey(x){
  const s=String(x.dateFrom||x.date||"").replace(/[^\d\-]/g,"");
  const n=parseInt(s,10);
  return Number.isFinite(n)?n:Infinity;
}
function formatTimelineYear(x){
  const a=String(x.dateFrom||x.date||"").trim();
  const b=String(x.dateTo||"").trim();
  if(!a&&!b) return "年代未設定";
  const fa=a?(a.endsWith("年")?a:a+"年"):"";
  const fb=b?(b.endsWith("年")?b:b+"年"):"";
  if(!a) return fb;
  if(!b||a===b) return fa;
  return fa+" ~ "+fb;
}
function formatTimelineYearHtml(x){
  const a=String(x.dateFrom||x.date||"").trim();
  const b=String(x.dateTo||"").trim();
  if(!a&&!b) return esc("年代未設定");
  const fa=a?(a.endsWith("年")?a:a+"年"):"";
  const fb=b?(b.endsWith("年")?b:b+"年"):"";
  if(!a) return esc(fb);
  if(!b||a===b) return esc(fa);
  return esc(fa)+"<br>~<br>"+esc(fb);
}

function renderRelationDiagram(chars,rels){
  let nodes=chars;
  if(rels.length){
    const ids=new Set();
    rels.forEach(r=>{ids.add(r.fromId);ids.add(r.toId)});
    nodes=chars.filter(c=>ids.has(c.id));
    if(!nodes.length) nodes=chars;
  }
  const n=nodes.length;
  const W=600, H=Math.max(280, 100+n*22);
  const cx=W/2, cy=H/2, radius=Math.min(cx,cy)-55;
  const positions={};
  nodes.forEach((c,i)=>{
    const angle=(Math.PI*2*i)/n - Math.PI/2;
    positions[c.id]={x:cx+radius*Math.cos(angle),y:cy+radius*Math.sin(angle)};
  });
  const lines=rels.map(r=>{
    const a=positions[r.fromId], b=positions[r.toId];
    if(!a||!b) return "";
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text x="${mx}" y="${my-5}">${esc(r.type||"関係")}</text>`;
  }).join("");
  const nodeEls=nodes.map(c=>{
    const p=positions[c.id];
    const avatar=c.image
      ?`<img class="rel-avatar" src="${imageSrc(c.image)}" alt="">`
      :`<div class="rel-avatar-ph">${esc((c.name||"?").charAt(0))}</div>`;
    return `<div class="rel-node" style="left:${(p.x/W)*100}%;top:${(p.y/H)*100}%">${avatar}<div class="rel-name">${esc(c.name)}</div></div>`;
  }).join("");
  return `<div class="rel-diagram" style="aspect-ratio:${W}/${H};min-height:${Math.min(H,360)}px">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${lines}</svg>${nodeEls}</div>`;
}

  const toAv=to&&to.image?`<img class="mini-avatar" src="${imageSrc(to.image)}" alt="">`:`<div class="mini-avatar-ph">${esc((to?.name||"?").charAt(0))}</div>`;

}

.card h3{margin:0 0 4px;color:var(--gold);font-size:14px;font-weight:600}
.card .preview{font-size:12px;color:var(--muted);line-height:1.4}
.card .preview b{color:var(--text);font-weight:500}
.character-card{display:flex;gap:10px;align-items:flex-start}
.char-icon,.char-icon-placeholder{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:#14100c;flex-shrink:0}
.char-icon-placeholder{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.empty{padding:28px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;grid-column:1/-1;font-size:13px}
.map-wrap{position:relative;display:inline-block;max-width:100%;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#14100c}
.map-img{display:block;max-width:100%;height:auto;max-height:42vh;object-fit:contain}
.map-pin{position:absolute;transform:translate(-50%,-100%);width:8px;height:8px;cursor:pointer;z-index:2}
.map-pin::before{content:"";display:block;width:4px;height:4px;margin:2px;background:var(--gold);border:1px solid #1a1511;border-radius:50%}
.map-pin span{display:block;position:absolute;left:50%;top:-2px;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(0,0,0,.62);color:#fff;padding:1px 2px;border-radius:2px;font-size:7px;line-height:1.05;pointer-events:auto}
.map-pin:hover span{display:block}
.map-empty{padding:18px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}
.dialog{width:min(640px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.dialog h2{margin:0 0 10px;color:var(--gold);font-size:16px}
.detail-row{margin:8px 0;font-size:13px}
.detail-row .lbl{color:var(--muted);font-size:12px;display:block;margin-bottom:2px}
.detail-row .val{color:var(--text);white-space:pre-wrap}
.detail-img{max-width:160px;max-height:160px;border-radius:6px;border:1px solid var(--line);margin-top:6px;object-fit:cover}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:6px 12px;border-radius:4px;font-size:13px;cursor:pointer;font-family:inherit}
.btn:hover{background:#3a3026}
.rel-diagram{position:relative;width:100%;min-height:280px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px}
.rel-diagram svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.rel-diagram svg line{stroke:#5a4634;stroke-width:1.5}
.rel-diagram svg text{fill:var(--gold);font-size:11px;font-family:var(--font);text-anchor:middle;dominant-baseline:middle}
.rel-node{position:absolute;transform:translate(-50%,-50%);text-align:center;z-index:1;width:72px}
.rel-node .rel-avatar,.rel-node .rel-avatar-ph{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#14100c;display:block;margin:0 auto 4px}
.rel-node .rel-avatar-ph{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.rel-node .rel-name{font-size:11px;color:var(--text);line-height:1.25;word-break:break-all;max-width:72px;margin:0 auto}
.rel-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.rel-card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px}
.rel-card b{color:var(--gold)}.rel-type{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:1px 6px;font-size:11px;color:var(--gold);margin:0 3px}
@media(max-width:560px){.layout{flex-direction:column}aside{width:100%;height:auto;position:sticky;top:var(--header-h);border-right:0;border-bottom:1px solid var(--line);padding:6px}main{margin-left:0}nav{display:flex;flex-wrap:wrap;gap:2px}nav button{width:auto;padding:5px 8px;font-size:12px}}
/* ===== 名前のみ・線区切り一覧（共有ビューア） ===== */
.name-only-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.name-only-row{min-height:36px;display:flex;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;color:var(--text);font-size:13px}
.name-only-row:hover{background:var(--panel2);color:var(--gold)}
@media(max-width:560px){.name-only-row{min-height:32px;padding:6px 8px;font-size:12px}}

/* 領地表示：全領地を地図上に表示／領地名は黄色＋黒ふち */
.territory-overlay-name{color:#ffd84a !important;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,-2px 0 0 #000,2px 0 0 #000,0 -2px 0 #000,0 2px 0 #000;font-weight:700;white-space:nowrap;}

<body>
<header>
  <h1 id="worldTitle"></h1>
  <div class="badge">読み取り専用・閲覧用</div>
</header>
<div class="layout">
  <aside><nav id="nav"></nav></aside>
  <main id="app"></main>
</div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="dialog" id="modalBody"></div></div>
<script>
const DB=${dataJson};
const TYPES=${typesJson};
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
let current="home";
function buildNav(){
  document.getElementById("nav").innerHTML=\`<button class="\${current==="home"?"active":""}" onclick="show('home')">世界概要</button>\`+
    Object.entries(TYPES).map(([k,v])=>\`<button class="\${current===k?"active":""}" onclick="show('\${k}')">\${v.label}</button>\`).join("")+
    \`<button class="\${current==="relations"?"active":""}" onclick="show('relations')">相関図</button>\`;
}
function show(type){current=type;buildNav();
  if(type==="home") renderHome();
  else if(type==="relations") renderRelations();
  else renderList(type);
}
function renderHome(){
  document.getElementById("worldTitle").textContent=DB.world.name||"ファンタジー世界";
  const pins=DB.world.pins||[];
  let mapHtml="";
  if(!DB.world.mapImage) mapHtml='<div class="map-empty">マップ未設定</div>';
  else{
    mapHtml=\`<div class="map-wrap"><img class="map-img" src="\${DB.world.mapImage}">
      \${pins.map(p=>\`<div class="map-pin" style="left:\${p.x}%;top:\${p.y}%"><span>\${esc(p.label)}</span></div>\`).join("")}
    </div>\`;
  }
  document.getElementById("app").innerHTML=\`
    <div class="section-block">
      <h2 class="section-title">\${esc(DB.world.name)}</h2>
      <p class="world-desc">\${esc(DB.world.description||"概要は未設定です。")}</p>
      <div class="stats">\${Object.entries(TYPES).map(([k,v])=>\`<div class="stat"><small>\${v.label}</small><b>\${(DB.data[k]||[]).length}</b></div>\`).join("")}</div>
    </div>
    <div class="section-block"><h2 class="section-title">世界地図</h2>\${mapHtml}</div>\`;
}
function fieldLabel(type,key){return (TYPES[type].fields.find(f=>f[0]===key)||[key,key])[1]}
function renderList(type){
  const t=TYPES[type], arr=DB.data[type]||[];
  document.getElementById("app").innerHTML='<h2 class="section-title">'+t.label+'</h2><div class="name-only-list" id="cards"></div>';
  const el=document.getElementById("cards");
  if(type==="characters"){
    if(!arr.length){el.innerHTML='<div class="empty">未登録</div>';return;}
    el.innerHTML=arr.map(x=>{
      const av=x.image?'<img class="character-avatar" src="'+imageSrc(x.image)+'" alt="">':'<div class="character-avatar-ph">'+esc((x.name||"?").charAt(0))+'</div>';
      return '<div class="name-only-row character-row" onclick="showDetail(\''+type+'\',\''+x.id+'\')">'+av+'<span class="name-only-name">'+esc(x.name||"")+'</span></div>';
    }).join("");
    return;
  }
  if(type==="locations"){
    if(!arr.length){el.innerHTML='<div class="empty">未登録</div>';return;}
    const territories=DB.data.territories||[];
    const groups=territories.map(r=>({r,items:arr.filter(x=>x.territoryId===r.id)})).filter(g=>g.items.length);
    const ungrouped=arr.filter(x=>!territories.some(r=>r.id===x.territoryId));
    let html=groups.map(g=>'<div class="location-group"><div class="location-group-title">◻︎'+esc(g.r.name)+'</div><div class="location-tree">'+g.items.map((x,i)=>'<div class="location-tree-row" onclick="showDetail(\'locations\',\''+x.id+'\')"><span class="location-tree-branch">'+(i===g.items.length-1?'└':'├')+'</span><span class="location-tree-name">'+esc(x.name||"")+'</span></div>').join("")+'</div></div>').join("");
    if(ungrouped.length){html+='<div class="location-group"><div class="location-group-title">◻︎領地未設定</div><div class="location-tree">'+ungrouped.map((x,i)=>'<div class="location-tree-row" onclick="showDetail(\'locations\',\''+x.id+'\')"><span class="location-tree-branch">'+(i===ungrouped.length-1?'└':'├')+'</span><span class="location-tree-name">'+esc(x.name||"")+'</span></div>').join("")+'</div></div>';}
    el.innerHTML=html;
    return;
  }
  if(!arr.length){el.innerHTML='<div class="empty">未登録</div>';return}
  el.innerHTML=arr.map(x=>'<div class="name-only-row" onclick="showDetail(\''+type+'\',\''+x.id+'\')"><span class="name-only-name">'+esc(x.name||"")+'</span></div>').join("");
}
function showDetail(type,id){
  const t=TYPES[type], x=(DB.data[type]||[]).find(a=>a.id===id);if(!x)return;
  let rows=t.fields.map(([k,label])=>{
    if(k==="image"){
      return x.image?\`<div class="detail-row"><span class="lbl">\${label}</span><img class="detail-img" src="\${imageSrc(x.image)}"></div>\`:"";
    }
    if(!x[k]) return "";
    return \`<div class="detail-row"><span class="lbl">\${label}</span><div class="val">\${esc(x[k])}</div></div>\`;
  }).join("");
  document.getElementById("modalBody").innerHTML=\`<h2>\${esc(x.name)}</h2>\${rows}
    <div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal()">閉じる</button></div>\`;
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function getChar(id){return (DB.data.characters||[]).find(c=>c.id===id)}
function renderRelations(){
  const chars=DB.data.characters||[], rels=DB.data.relations||[];
  let body="";
  if(chars.length<2) body='<div class="empty">キャラクターが不足しています</div>';
  else{
    let nodes=chars;
    if(rels.length){const ids=new Set();rels.forEach(r=>{ids.add(r.fromId);ids.add(r.toId)});nodes=chars.filter(c=>ids.has(c.id));if(!nodes.length)nodes=chars}
    const n=nodes.length,W=600,H=Math.max(280,100+n*22),cx=W/2,cy=H/2,radius=Math.min(cx,cy)-55,positions={};
    nodes.forEach((c,i)=>{const angle=(Math.PI*2*i)/n-Math.PI/2;positions[c.id]={x:cx+radius*Math.cos(angle),y:cy+radius*Math.sin(angle)}});
    const lines=rels.map(r=>{const a=positions[r.fromId],b=positions[r.toId];if(!a||!b)return"";const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;return \`<line x1="\${a.x}" y1="\${a.y}" x2="\${b.x}" y2="\${b.y}"/><text x="\${mx}" y="\${my-5}">\${esc(r.type||"関係")}</text>\`}).join("");
    const nodeEls=nodes.map(c=>{const p=positions[c.id];const av=c.image?\`<img class="rel-avatar" src="\${imageSrc(c.image)}">\`:\`<div class="rel-avatar-ph">\${esc((c.name||"?").charAt(0))}</div>\`;return \`<div class="rel-node" style="left:\${(p.x/W)*100}%;top:\${(p.y/H)*100}%">\${av}<div class="rel-name">\${esc(c.name)}</div></div>\`}).join("");
    body=\`<div class="rel-diagram" style="aspect-ratio:\${W}/\${H};min-height:\${Math.min(H,360)}px"><svg viewBox="0 0 \${W} \${H}" preserveAspectRatio="xMidYMid meet">\${lines}</svg>\${nodeEls}</div>\`;
    if(rels.length) body+=\`<div class="rel-list">\${rels.map(r=>{const from=getChar(r.fromId),to=getChar(r.toId);return \`<div class="rel-card"><b>\${esc(from?.name||"?")}</b><span class="rel-type">\${esc(r.type||"関係")}</span><b>\${esc(to?.name||"?")}</b>\${r.notes?\`<div style="color:var(--muted);margin-top:2px">\${esc(r.notes)}</div>\`:""}</div>\`}).join("")}</div>\`;
  }
  document.getElementById("app").innerHTML=\`<h2 class="section-title">相関図</h2>\${body}\`;
}
buildNav();show("home");
<\/script>

</body>
</html>`;
  let blob,filename;
  try{
    blob=new Blob([html],{type:"text/html;charset=utf-8"});
    filename=(db.world.name||"fantasy-world")+"_閲覧用.html";
  }catch(e){
    alert("書き出しデータの作成に失敗しました");
    return;
  }
  // iPhone等：共有シート →「ファイルに保存」で保存先を選べる
  try{
    const file=new File([blob],filename,{type:"text/html"});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      return;
    }
  }catch(e){
    if(e&&e.name==="AbortError") return;
  }
  // PC等：保存先を選ぶダイアログ
  try{
    if(typeof window.showSaveFilePicker==="function"){
      const handle=await window.showSaveFilePicker({
        suggestedName:filename,
        types:[{description:"HTML",accept:{"text/html":[".html"]}}]
      });
      const writable=await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      alert("書き出しました：\n"+filename);
      return;
    }
  }catch(e){
    if(e&&e.name==="AbortError") return;
  }
  // フォールバック：ダウンロード
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  a.style.display="none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(url);if(a.parentNode)a.parentNode.removeChild(a);},2000);
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const x=JSON.parse(r.result);
      // バックアップJSON（単一世界）を新しい世界として追加
      if(x.data){
        const w=normalizeWorld(x);
        w.id=crypto.randomUUID();
        store.worlds.unshift(w);
        store.currentId=w.id;
        db=w;
        save();
        current="home";
        buildNav();
        renderHome();
        alert("新しい世界として読み込みました");
        return;
      }
      // ストア全体の形式
      if(Array.isArray(x.worlds)){
        store={worlds:x.worlds.map(normalizeWorld),currentId:x.currentId||null};
        if(store.currentId&&!store.worlds.find(w=>w.id===store.currentId)) store.currentId=store.worlds[0]?.id||null;
        syncDbFromStore();
        save();
        if(db){current="home";buildNav();renderHome()}
        else showWorlds();
        alert("読み込みました");
        return;
      }
      throw Error();
    }catch{alert("正しいJSONではありません")}
  };
  r.readAsText(f);e.target.value="";
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
// オンライン版はログイン後に世界一覧を表示
store.currentId=null;
db=null;
current="worlds";
buildNav();
renderWorlds();
window.addEventListener("beforeunload",save);
window.showLoginPanel=function(){document.getElementById("loginPanel").hidden=false;document.getElementById("registerPanel").hidden=true;};
window.showRegisterPanel=function(){document.getElementById("loginPanel").hidden=true;document.getElementById("registerPanel").hidden=false;};
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

/* Firebaseコンソールで作成したWebアプリの設定をここへ貼り付けてください */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

let firebaseEnabled = !Object.values(firebaseConfig).some(v=>String(v).startsWith("YOUR_"));
let auth=null, firestore=null, saveTimer=null;
if(firebaseEnabled){
  try{
    const app=initializeApp(firebaseConfig);
    auth=getAuth(app); firestore=getFirestore(app);
  }catch(e){console.error(e);firebaseEnabled=false;}
}
window.onlineUser=null;
window.saveCloudImage=async(dataUrl)=>{
  if(!auth?.currentUser) throw new Error("未ログインです");
  if(String(dataUrl).length>950000) throw new Error("画像が大きすぎます。もう少し小さい画像にしてください。");
  const key=crypto.randomUUID();
  await setDoc(doc(firestore,"users",auth.currentUser.uid,"images",key),{dataUrl,createdAt:Date.now()});
  return "fsimg:"+key;
};
window.getCloudImage=async(key)=>{
  if(!auth?.currentUser) return "";
  const snap=await getDoc(doc(firestore,"users",auth.currentUser.uid,"images",key));
  return snap.exists()?snap.data().dataUrl||"":"";
};
window.queueCloudSave=()=>{
  if(!firebaseEnabled || !window.onlineUser || !window.getCurrentDb?.()) return;
  clearTimeout(saveTimer); saveTimer=setTimeout(()=>cloudSave().catch(console.error),700);
};

function accountEmail(name){return name.trim().toLowerCase()+"@fantasycodex.invalid";}
function validAccount(name){return /^[A-Za-z0-9_-]{3,32}$/.test(name.trim());}
function msg(id,text){const el=document.getElementById(id);if(el)el.textContent=text||"";}
function errorText(e){
  const c=e?.code||"";
  const map={
    "auth/invalid-credential":"アカウント名またはパスワードが違います。",
    "auth/email-already-in-use":"そのアカウント名はすでに使われています。",
    "auth/weak-password":"パスワードは6文字以上にしてください。",
    "auth/too-many-requests":"試行回数が多すぎます。しばらく待ってから再試行してください。",
    "auth/network-request-failed":"ネットワーク接続を確認してください。"
  };
  return map[c]||"処理に失敗しました。もう一度試してください。";
}
window.onlineRegister=async()=>{
  const name=document.getElementById("registerAccount").value.trim();
  const pw=document.getElementById("registerPassword").value;
  const pw2=document.getElementById("registerPassword2").value;
  msg("registerMessage","");
  if(!firebaseEnabled){msg("registerMessage","Firebaseの設定がまだ完了していません。");return;}
  if(!validAccount(name)){msg("registerMessage","アカウント名は英数字・_・-の3～32文字で入力してください。");return;}
  if(pw!==pw2){msg("registerMessage","パスワードが一致していません。");return;}
  if(pw.length<6){msg("registerMessage","パスワードは6文字以上にしてください。");return;}
  try{
    const cred=await createUserWithEmailAndPassword(auth,accountEmail(name),pw);
    await setDoc(doc(firestore,"users",cred.user.uid),{accountName:name,createdAt:Date.now()},{merge:true});
    msg("registerMessage","登録しました。ログインしています…");
  }catch(e){msg("registerMessage",errorText(e));}
  return false;
};
window.onlineLogin=async()=>{
  const name=document.getElementById("loginAccount").value.trim();
  const pw=document.getElementById("loginPassword").value;
  msg("loginMessage","");
  if(!firebaseEnabled){msg("loginMessage","Firebaseの設定がまだ完了していません。");return;}
  if(!validAccount(name)){msg("loginMessage","アカウント名を確認してください。");return;}
  try{await signInWithEmailAndPassword(auth,accountEmail(name),pw);}
  catch(e){msg("loginMessage",errorText(e));}
  return false;
};
window.onlineLogout=async()=>{if(auth)await signOut(auth);};
window.deleteCloudWorld=async(id)=>{
  if(!auth?.currentUser)return;
  await deleteDoc(doc(firestore,"users",auth.currentUser.uid,"worlds",id));
};

async function cloudLoad(user){
  const root=collection(firestore,"users",user.uid,"worlds");
  const snap=await getDocs(root);
  const worlds=snap.docs.map(d=>({id:d.id,...d.data()}));
  window.applyCloudWorlds(worlds);
  document.getElementById("authGate").hidden=true;
  document.getElementById("appShell").hidden=false;
  document.getElementById("mainHeader").style.display="flex";
  document.getElementById("accountBar").innerHTML=`<span>${esc(user.displayName||user.email?.split("@")[0]||"")}</span><button class="btn" onclick="onlineLogout()">ログアウト</button>`;
  buildNav();renderWorlds();
}
async function cloudSave(){
  const currentDb=window.getCurrentDb?.();
  if(!auth?.currentUser || !currentDb) return;
  const world=JSON.parse(JSON.stringify(currentDb));
  await setDoc(doc(firestore,"users",auth.currentUser.uid,"worlds",world.id),world,{merge:false});
}

if(firebaseEnabled && auth){
  onAuthStateChanged(auth,async user=>{
  if(!firebaseEnabled){
    document.getElementById("authGate").hidden=false;document.getElementById("appShell").hidden=true;document.getElementById("mainHeader").style.display="none";
    msg("loginMessage","Firebase設定を入力するとオンライン版が使えます。");
    return;
  }
  if(user){
    window.onlineUser=user;
    try{await cloudLoad(user);}catch(e){console.error(e);msg("loginMessage","データの読み込みに失敗しました。");}
  }else{
    window.onlineUser=null;
    document.getElementById("authGate").hidden=false;document.getElementById("appShell").hidden=true;
    document.getElementById("mainHeader").style.display="none";
    document.getElementById("accountBar").innerHTML="";
    showLoginPanel();
  }
  });
}
</script>
</body>
</html>
